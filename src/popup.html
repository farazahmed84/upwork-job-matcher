<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Upwork Job Matcher</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Upwork Job Matcher</h1>
      <form id="profile-form">
        <label for="profile-title">Profile title</label>
        <input id="profile-title" name="profileTitle" type="text" required>

        <label for="profile-description">Profile description</label>
        <textarea id="profile-description" name="profileDescription" rows="6" required></textarea>

        <label for="profile-skills">Skills</label>
        <input
          id="profile-skills"
          name="profileSkills"
          type="text"
          placeholder="WordPress, SEO, Shopify"
          required
        >

        <button type="submit">Save</button>
        <p id="status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
